<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="820" height="300" fill="#f5f5f5"/>
  <text x="410" y="44" text-anchor="middle" font-size="21" font-weight="800" fill="#171717">예시 이미지 (SVG 다이어그램)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#171717"/>
    </marker>
  </defs>

  <!-- box 1 -->
  <rect x="30" y="120" width="210" height="100" rx="14" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="135" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#171717">Markdown</text>
  <text x="135" y="192" text-anchor="middle" font-size="13" fill="#737373">글 작성</text>

  <line x1="248" y1="170" x2="298" y2="170" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- box 2 -->
  <rect x="305" y="120" width="210" height="100" rx="14" fill="#ffffff" stroke="#171717" stroke-width="2"/>
  <text x="410" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#171717">Hugo</text>
  <text x="410" y="192" text-anchor="middle" font-size="13" fill="#737373">HTML로 빌드</text>

  <line x1="523" y1="170" x2="573" y2="170" stroke="#171717" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- box 3 -->
  <rect x="580" y="120" width="210" height="100" rx="14" fill="#171717"/>
  <text x="685" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">GitHub Pages</text>
  <text x="685" y="192" text-anchor="middle" font-size="13" fill="#bdbdbd">라이브 배포</text>
</svg>
